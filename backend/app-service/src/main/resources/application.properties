spring.application.name=gestion-coworking

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_coworking
spring.datasource.username=root
spring.datasource.password=

# Hibernate: Flyway manages the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Log SQL queries (useful during development, remove later)
spring.jpa.show-sql=true

# Placeholder UUID while auth-service is not developed
app.placeholder-user-id=00000000-0000-0000-0000-000000000001
app.placeholder-user-role=ADMIN

# Front-end origins allowed to call the API (comma-separated)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost
