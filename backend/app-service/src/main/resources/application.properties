spring.application.name=gestion-coworking

# Settings for every environment. Development adds application-dev.properties (local database, SQL logging, admin role).
# Production sets another profile (SPRING_PROFILES_ACTIVE=prod) and gives the database connection in environment
# variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# Any setting below can be changed the same way, e.g. APP_PLACEHOLDERUSERROLE, APP_CORS_ALLOWEDORIGINS.

# Profile used when none is set: Maven, the IDE and the tests run as development without options
spring.profiles.default=dev

# Hibernate: Flyway manages the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Placeholder user while auth-service is not developed
app.placeholder-user-id=00000000-0000-0000-0000-000000000001
# Role: ADMIN, CLIENT, or empty for a guest (every request is anonymous)
app.placeholder-user-role=

# Front-end origins allowed to call the API (comma-separated):
# the React app's dev server (Vite) and a local web server on port 80 (e.g. Apache serving frontend/app/dist)
app.cors.allowed-origins=http://localhost:5173,http://localhost
